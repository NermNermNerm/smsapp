
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64" viewBox="0 0 64 64">

  <!-- Phone body (expanded to fill more of the viewBox) -->
  <rect x="10" y="4" width="44" height="56" rx="5" ry="5"
        fill="#ffffff" fill-opacity="0.85"/>

  <!-- Phone screen -->
  <rect x="14" y="10" width="36" height="42" rx="3" ry="3"
        fill="#101010" fill-opacity="0.9"/>

  <!-- Bottom bar -->
  <rect x="22" y="54" width="20" height="4" rx="2" ry="2"
        fill="#202020"/>

  <!-- Connection dot (lower-right) -->
  <circle cx="46" cy="48" r="8" fill="#2ecc71"/>

  <!-- Message sparkle (upper-left), absolute coords, no scale -->
  <g transform="translate(22,16) scale(2.5)">
    <!-- long, thin four-point star -->
    <polygon points="0,-5 1,-1 5,0 1,1 0,5 -1,1 -5,0 -1,-1"
             fill="#3498db"/>
  </g>
</svg>

# OTP Scanner rule file
# Created automatically on first run.
# Edit freely.
#
# This file contains two sections:
#
#   [default-en]
#       A trivial (and perhaps oversensitive) OTP scanner that just looks
#       for the word "code" near a 6-digit sequence.
#
#   [sender-aliases]
#       Optional mappings that identify the sender based on text found
#       in the message body. This does NOT affect OTP detection.
#
# --------------------------------------------------------------------
#
# OTP RULES (strict)
#
# All rules in this section are REQUIRED. If any rule fails, the message
# is NOT considered an OTP.
#
# Rule types:
#
#   codeLength=N
#       OTP must be exactly N digits long.
#
#   codeType=digits|alnum
#       OTP must be numeric or alphanumeric.
#
#   nearN=phrase
#       'phrase' must appear within N words of the OTP code.
#
#   near=phrase
#       Shorthand for near3 (phrase must be near the code).
#
#   anywhere=phrase
#       'phrase' must appear somewhere in the message body.
#
# Notes:
#   - 'phrase' for 'near#', 'near', or 'anywhere' can actually be a list
#     of phrases, separated by '|', which matches if any one matches.
#   - Matching is case-insensitive.
#   - Word-boundary matching is used.
#   - These rules are strict: ALL must match.
#
# --------------------------------------------------------------------

# --------------------------------------------------------------------
#
# SENDER ALIASES (optional)
#
# This section maps canonical sender names to alias phrases.
#
# INI keys cannot contain spaces, so underscores are used. When shown
# to the user, underscores are replaced with spaces.
#
# Format:
#
#   Canonical_Name=Alias1|Alias2|Alias3
#
# Meaning:
#   - Canonical_Name (underscores replaced with spaces) is what appears
#     in the toast.
#   - If any alias appears in the message body, the sender is considered
#     to be Canonical_Name.
#
# If the value is empty, the key itself (with underscores replaced) is
# used as the alias.
#
# Examples:
#
#   Bank_of_America=Bank of America|BofA
#   Google=
#
# --------------------------------------------------------------------

[default-en]
codeLength=6
codeType=digits
near=code|passcode

[sender-aliases]
